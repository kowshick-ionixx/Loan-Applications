$kind: http-request
name: "Invalid JSON - 400"
url: "{{baseUrl}}/customers/"
method: POST
headers:
  - key: Authorization
    value: "Bearer {{officerToken}}"
  - key: Content-Type
    value: "application/json"
body:
  type: text
  content: |-
    {"name": "Broken",
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 400", () => pm.response.to.have.status(400));
      pm.test("error INVALID_REQUEST", () => pm.expect(pm.response.json().error).to.eql("INVALID_REQUEST"));
order: 9000
