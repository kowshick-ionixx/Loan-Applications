$kind: http-request
name: "Future DOB - 400"
url: "{{baseUrl}}/customers/"
method: POST
headers:
  - key: Authorization
    value: "Bearer {{officerToken}}"
  - key: Content-Type
    value: "application/json"
body:
  type: text
  content: |-
    {
      "name": "Future Born",
      "email": "f{{ts}}@example.com",
      "phone": "{{phone2}}",
      "date_of_birth": "2999-01-01",
      "monthly_income": 50000
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 400", () => pm.response.to.have.status(400));
      pm.test("error VALIDATION_FAILED", () => pm.expect(pm.response.json().error).to.eql("VALIDATION_FAILED"));
      pm.test("field date_of_birth", () => pm.expect(pm.response.json().details.map(d => d.field)).to.include("date_of_birth"));
order: 4000
