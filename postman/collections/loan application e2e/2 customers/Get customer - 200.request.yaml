$kind: http-request
name: "Get customer - 200"
url: "{{baseUrl}}/customers/{{otherId}}"
method: GET
headers:
  - key: Authorization
    value: "Bearer {{officerToken}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
order: 10000
