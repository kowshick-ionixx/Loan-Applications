$kind: http-request
name: "Delete customer - 200"
url: "{{baseUrl}}/customers/{{emptyId}}"
method: DELETE
headers:
  - key: Authorization
    value: "Bearer {{officerToken}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
order: 18000
