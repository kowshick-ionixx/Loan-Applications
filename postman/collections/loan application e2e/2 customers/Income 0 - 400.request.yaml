$kind: http-request
name: "Income 0 - 400"
url: "{{baseUrl}}/customers/"
method: POST
headers:
  - key: Authorization
    value: "Bearer {{officerToken}}"
  - key: Content-Type
    value: "application/json"
body:
  type: text
  content: |-
    {
      "name": "No Income",
      "email": "i{{ts}}@example.com",
      "phone": "{{phone2}}",
      "date_of_birth": "1995-04-15",
      "monthly_income": 0
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 400", () => pm.response.to.have.status(400));
      pm.test("error VALIDATION_FAILED", () => pm.expect(pm.response.json().error).to.eql("VALIDATION_FAILED"));
      pm.test("field monthly_income", () => pm.expect(pm.response.json().details.map(d => d.field)).to.include("monthly_income"));
order: 5000
