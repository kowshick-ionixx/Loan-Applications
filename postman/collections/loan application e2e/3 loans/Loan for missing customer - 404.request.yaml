$kind: http-request
name: "Loan for missing customer - 404"
url: "{{baseUrl}}/loans/apply"
method: POST
headers:
  - key: Authorization
    value: "Bearer {{officerToken}}"
  - key: Content-Type
    value: "application/json"
body:
  type: text
  content: |-
    {
      "customer_id": 999999,
      "amount": 300000,
      "tenure_months": 36
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 404", () => pm.response.to.have.status(404));
      pm.test("error NOT_FOUND", () => pm.expect(pm.response.json().error).to.eql("NOT_FOUND"));
order: 4000
