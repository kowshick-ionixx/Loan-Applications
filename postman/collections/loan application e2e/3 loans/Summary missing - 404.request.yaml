$kind: http-request
name: "Summary missing - 404"
url: "{{baseUrl}}/customers/999999/summary"
method: GET
headers:
  - key: Authorization
    value: "Bearer {{officerToken}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 404", () => pm.response.to.have.status(404));
      pm.test("error NOT_FOUND", () => pm.expect(pm.response.json().error).to.eql("NOT_FOUND"));
order: 21000
