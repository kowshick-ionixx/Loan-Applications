$kind: http-request
name: "Wrong password - 401"
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  - key: Content-Type
    value: "application/x-www-form-urlencoded"
body:
  type: text
  content: |-
    username=officer1&password=Wrong@123
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 401", () => pm.response.to.have.status(401));
order: 4000
