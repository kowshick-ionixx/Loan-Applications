$kind: http-request
name: "Own summary - 200"
url: "{{baseUrl}}/customers/{{myId}}/summary"
method: GET
headers:
  - key: Authorization
    value: "Bearer {{customerToken}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
order: 3000
