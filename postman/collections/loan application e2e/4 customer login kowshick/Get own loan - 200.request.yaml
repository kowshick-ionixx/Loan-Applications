$kind: http-request
name: "Get own loan - 200"
url: "{{baseUrl}}/loans/{{myLoan}}"
method: GET
headers:
  - key: Authorization
    value: "Bearer {{customerToken}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
order: 5000
