[project]
name = "loan-application"
version = "0.1.0"
description = "Loan Application Service — FastAPI + PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "coverage>=7.16.2",
    "fastapi[standard]>=0.142.2",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "ollama>=0.6.3",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.3",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "coverage>=7.16.2",
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --color=yes"
console_output_style = "classic"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
